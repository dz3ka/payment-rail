name: preview-environment

on:
  pull_request:

permissions:
  contents: read

# Two runs of one PR apply the same object; an overtaken run would record the
# older head SHA, so keep at most one alive per PR.
concurrency:
  group: preview-environment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # The callee derives the repository and its own ref itself, so there is
    # nothing to pass for either; it rejects inputs it does not declare.
    uses: dz3ka/bosun/.github/workflows/preview-environment.yml@main
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      template-path: deploy/paymentstack.yaml
      namespace: payment-rail-previews
      # Set explicitly: bosun computes expiresAt from the object's creation
      # time, and a re-apply on a later push does not extend it, so the default
      # 60 would delete the preview an hour after the PR's first push.
      ttl-minutes: 480
      # images is omitted, not passed empty: the callee defaults it.
    secrets:
      # Never `secrets: inherit` — that ships every secret to a workflow in
      # another repository. PREVIEW_KUBECONFIG must be configured in this
      # repo's settings for the job to run.
      kubeconfig: ${{ secrets.PREVIEW_KUBECONFIG }}
