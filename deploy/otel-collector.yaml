# Minimal OpenTelemetry Collector config for local dev: accept OTLP over
# gRPC/HTTP and log to the collector's stdout. Swap the debug exporter for
# Tempo/Prometheus/Grafana when the observability stack lands.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
